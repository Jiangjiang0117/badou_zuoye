[project]
name = "deep-research-assistant"
version = "0.1.0"
description = "深度研究助手 —— 规划 / 多轮检索 / 阅读抽取 / 缺口补检 / 综合报告"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx[http2]>=0.27",
    "openai>=1.54",
    "trafilatura>=1.12",
    "readability-lxml>=0.8.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

# 这是一个应用而非库，不需要构建成包；uv sync 只装依赖。
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 项目未构建成包（package = false），显式把 backend/ 加进 sys.path 才能 import app
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
