    - data:
        code: "import requests\nimport json\n\ndef main(keyword: str, api_key: str):\n\
          \    if not api_key:\n        raise ValueError(\"请配置BOCHA_API_KEY环境变量\"\
          )\n    response = requests.post(\n        \"https://api.bocha.cn/v1/web-search\"\
          ,\n        headers={\"Authorization\": \"Bearer \" + api_key, \"Content-Type\"\
          : \"application/json\"},\n        json={\"query\": keyword, \"summary\"\
          : True, \"count\": 3},\n        timeout=30,\n    )\n    response.raise_for_status()\n\
          \    data = response.json()\n    pages = ((data.get(\"data\") or {}).get(\"\
          webPages\") or {}).get(\"value\") or []\n    if not pages:\n        raise\
          \ ValueError(\"Bocha未返回有效网页，请检查搜索词、额度或接口状态\")\n    seen = set()\n    sources\
          \ = []\n    for page in pages:\n        url = page.get(\"url\", \"\")\n\
          \        if not url or url in seen:\n            continue\n        seen.add(url)\n\
          \        sources.append({\"title\": page.get(\"name\", \"\"), \"url\": url,\
          \ \"summary\": (page.get(\"summary\") or page.get(\"snippet\") or \"\")[:6000],\
          \ \"datePublished\": page.get(\"datePublished\", \"\"), \"evidence_type\"\
          : \"search_summary\"})\n    return {\"result\": json.dumps({\"query\": keyword,\
          \ \"sources\": sources}, ensure_ascii=False)}\n"
